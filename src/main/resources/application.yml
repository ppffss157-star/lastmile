spring:
  application:
    name: lastmile

  jpa:
    hibernate:
      ddl-auto: none          # Flyway 接管建表，Hibernate 不碰
    properties:
      hibernate:
        format_sql: true       # SQL 格式化输出，看着舒服

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: redis

  # ============================
  # 默认激活 dev 环境
  # 切换方式：
  #   1. 改这里：dev → prod
  #   2. 命令行：java -jar app.jar --spring.profiles.active=prod
  #   3. 环境变量：SPRING_PROFILES_ACTIVE=prod
  #   4. IDEA Run Configuration → Active profiles 填 prod
  # ============================
  profiles:
    active: dev

# ============================
# Actuator — 运维端点配置
# ============================
management:
  endpoints:
    web:
      exposure:
        # include: "*" 生产环境慎用，这里演示先全开
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always     # 开发环境展示详情：磁盘空间、数据库连接等
  metrics:
    export:
      prometheus:
        enabled: true          # 开启 Prometheus 格式导出
    tags:
      application: ${spring.application.name}   # 所有指标自动打上 app 标签
    distribution:
      # 开启 HTTP 请求的百分位直方图，这样才能查到 P95/P99
      percentiles-histogram:
        http.server.requests: true
      # SLO 桶：定义延迟边界，统计各桶内的请求数
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s
