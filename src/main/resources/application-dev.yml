# ============================
# 开发环境 — 本机跑
# ============================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/logistics_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  jpa:
    show-sql: true             # 开发看 SQL，排查方便

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    # 消费重试：3 次指数退避（3s → 6s → 12s），耗尽后 Reject → DLX → DLQ
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3          # 最多 3 次（含第 1 次）
          initial-interval: 3000   # 首次重试间隔 3s
          multiplier: 2.0          # 每次间隔 ×2
          max-interval: 30000      # 间隔上限 30s
    publisher-confirm-type: correlated
    publisher-returns: true

  elasticsearch:
    uris: http://localhost:9200
    # 开发环境连 Docker 里的单节点 ES，不设用户名密码

nacos:
  server-addr: localhost:8848   # 开发环境连 Docker 里的 Nacos

server:
  port: 9090                    # 8080 让给 Gateway

logging:
  level:
    com.example.logistics: debug   # 自己写的代码打 debug 日志
    org.hibernate.SQL: debug       # Hibernate 打印 SQL 参数绑定（比 show-sql 更详细）

# Tracing 开发环境：全采样 + 连接本地 Zipkin
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
