# ============================
# 生产环境 — 服务器/Docker
# 敏感信息（密码、密钥）一律走环境变量，绝不硬编码
# ============================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/logistics_db?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}       # 必须通过环境变量注入！

  jpa:
    show-sql: false             # 生产关掉，不然日志爆炸 + 性能损耗

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}  # Redis 密码，有就填

server:
  port: ${SERVER_PORT:9090}

logging:
  level:
    com.example.logistics: warn   # 自己代码只记警告和错误
    root: info                    # 其他框架默认 info
