server:
  port: 9091

spring:
  application:
    name: order-service

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace:

  datasource:
    url: jdbc:mysql://localhost:3306/logistics_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update       # 开发环境自动建表
    show-sql: true

# ============================
# Resilience4j — 熔断/重试/舱壁
# ============================
resilience4j:
  retry:
    instances:
      courierService:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - java.lang.RuntimeException
  circuitbreaker:
    instances:
      courierService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5        # 5 次调用后开始评估（默认 10，调小加快演示）
        automaticTransitionFromOpenToHalfOpenEnabled: true
  bulkhead:
    instances:
      courierService:
        maxConcurrentCalls: 5
        maxWaitDuration: 100ms

# ============================
# Micrometer Tracing — Zipkin
# ============================
management:
  tracing:
    sampling:
      probability: 1.0       # 开发环境全采样
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.example.order: debug
    zipkin2: debug
    io.micrometer.tracing: debug
