# ===== MySQL Deployment =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: lastmile
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: mysql-database
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
# ===== MySQL Service =====
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: lastmile
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
